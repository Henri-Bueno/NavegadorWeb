<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>NavegadorWeb</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./dist/main.js"></script>
  </head>
  <body>
    <div class="browser">
      <header class="topbar">
        <a class="brand" href="/" aria-label="NavegadorWeb - início">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" />
              <path
                d="M3.5 9h17M3.5 15h17M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"
              />
            </svg>
          </span>
          <span>Navegador<span class="brand-accent">Web</span></span>
        </a>
      </header>

      <nav class="toolbar" aria-label="Barra de navegação">
        <div class="navigation-controls" aria-label="Controles visuais">
          <button
            id="back-button"
            class="back-button icon-button"
            type="button"
            aria-label="Voltar"
            title="Voltar"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <button
            id="forward-button"
            class="forward-button icon-button"
            type="button"
            aria-label="Avançar"
            title="Avançar"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
          <button
            id="refresh-button"
            class="icon-button"
            type="button"
            aria-label="Atualizar"
            title="Atualizar"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 7v5h-5M4 17v-5h5" />
              <path
                d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"
              />
            </svg>
          </button>
        </div>

        <label class="address-field">
          <span class="sr-only">Endereço da página</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m16 16 4 4" />
          </svg>
          <input
            type="text"
            id="url-input"
            placeholder="Digite um endereço..."
            autocomplete="url"
          />
        </label>
        <button id="navigate-button" class="navigate-button" type="button">
          Acessar
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14m-6-6 6 6-6 6" />
          </svg>
        </button>
      </nav>

      <div class="workspace">
        <aside class="sidebar" aria-label="Histórico e favoritos">
          <section class="sidebar-section" aria-labelledby="history-heading">
            <h2 class="section-heading" id="history-heading">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
              </svg>
              Histórico
            </h2>
            <div id="history-list" class="history-list">
              <p class="empty-state">Suas páginas recentes aparecerão aqui.</p>
            </div>
            <template id="history-item-template">
              <div class="history-item">
                <img class="history-item-icon" alt="" aria-hidden="true" />
                <span class="history-item-title"></span>
                <div class="history-item-actions">
                  <button
                    class="history-action-button"
                    type="button"
                    aria-label="Adicionar aos favoritos"
                    title="Adicionar aos favoritos"
                    data-action="favorite"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"
                      />
                    </svg>
                  </button>
                  <button
                    class="history-action-button history-delete-button"
                    type="button"
                    aria-label="Excluir do histórico"
                    title="Excluir do histórico"
                    data-action="delete"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3" />
                    </svg>
                  </button>
                </div>
              </div>
            </template>
          </section>

          <section class="sidebar-section" aria-labelledby="favorites-heading">
            <h2 class="section-heading" id="favorites-heading">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"
                />
              </svg>
              Favoritos
            </h2>
            <div id="favorites-list" class="favorites-list">
              <p class="empty-state">Seus favoritos aparecerão aqui.</p>
            </div>
            <template id="favorites-item-template">
              <div class="favorite-item">
                <img class="favorite-item-icon" alt="" aria-hidden="true" />
                <span class="favorite-item-title"></span>
                <div class="favorite-item-actions">
                  <button
                    class="favorite-action-button"
                    type="button"
                    aria-label="Remover dos favoritos"
                    title="Remover dos favoritos"
                    data-action="favorite"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"
                      />
                    </svg>
                  </button>
                </div>
              </div>
            </template>
          </section>
        </aside>

        <main class="page-area">
          <input
            id="frame-toggle"
            class="frame-toggle"
            type="checkbox"
            aria-label="Expandir ou recolher a página"
          />
          <iframe
            id="browser-frame"
            src="https://example.com"
            title="Página acessada"
          ></iframe>
          <label
            class="frame-toggle-button"
            for="frame-toggle"
            title="Expandir ou recolher a página"
          >
            <svg class="expand-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
            </svg>
            <svg class="collapse-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3v5H3m13-5v5h5M3 16h5v5m13-5h-5v5" />
            </svg>
          </label>
        </main>
      </div>
      <footer class="structure-footer">
        <section class="structure-panel" aria-labelledby="structure-heading">
          <h2 class="structure-heading" id="structure-heading">
            Estrutura de navegação
          </h2>
          <div class="structure-current">
            <span class="structure-label">Visita atual</span>
            <strong id="structure-current-title">Nenhuma página aberta</strong>
            <span id="structure-current-url" class="structure-url">
              O navegador está sem uma visita atual.
            </span>
          </div>
          <div class="stack-grid">
            <section class="stack-card" aria-labelledby="back-stack-heading">
              <div class="stack-card-heading">
                <h3 id="back-stack-heading">Pilha voltar</h3>
                <span id="back-stack-count" class="stack-count">0 páginas</span>
              </div>
              <pre id="back-stack-items" class="stack-items">Pilha vazia</pre>
            </section>
            <section class="stack-card" aria-labelledby="forward-stack-heading">
              <div class="stack-card-heading">
                <h3 id="forward-stack-heading">Pilha avançar</h3>
                <span id="forward-stack-count" class="stack-count">0 páginas</span>
              </div>
              <pre id="forward-stack-items" class="stack-items">Pilha vazia</pre>
            </section>
          </div>
        </section>
      </footer>
    </div>
  </body>
</html>
